<div class="shell">
  <div
    class="route-progress"
    [class.route-progress--active]="routeLoading()"
    aria-hidden="true"
  ></div>

  <header class="header">
    @if (pathname() !== '/') {
      <button
        type="button"
        class="icon-btn"
        (click)="goBack()"
        aria-label="Go back"
      >
        ←
      </button>
    }

    <h1 class="title">Angular developer's guide</h1>

    <nav class="desktop-about">
      <a [routerLink]="routes.about" class="link">About</a>
    </nav>

    <button
      type="button"
      class="icon-btn hamburger"
      (click)="toggleDrawer()"
      [attr.aria-expanded]="drawerOpen()"
      aria-label="Open menu"
    >
      ☰
    </button>

    <ui-theme-toggle />
  </header>

  <main class="main">
    <router-outlet />
  </main>

  @if (drawerOpen()) {
    <div class="drawer-overlay" role="dialog" aria-modal="true" aria-label="Menu">
      <button
        type="button"
        class="backdrop"
        (click)="closeDrawer()"
        aria-label="Close menu"
        tabindex="-1"
      ></button>
      <div class="panel">
        <div class="panel-head">
          <span class="overline">Menu</span>
          <button
            type="button"
            class="icon-btn"
            (click)="closeDrawer()"
            aria-label="Close menu"
          >
            ✕
          </button>
        </div>
        <a [routerLink]="routes.about" class="drawer-link">About</a>
      </div>
    </div>
  }
</div>
