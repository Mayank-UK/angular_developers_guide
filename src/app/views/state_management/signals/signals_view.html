<div class="page">
  <!-- 0. When to use — the hub's framing -->
  <ui-section-wrapper title="When to reach for signals (local state)">
    <ui-content-group-wrapper title="The lightest tool that fits">
      <ui-text-block text="This screen is the LOCAL / COMPONENT state answer to the state-management hub's question: which state are you managing? Signals are Angular's built-in, no-library reactive primitive — they hold the state of ONE component (or a small subtree) and they cover ~90% of UI state in a well-factored app. The rule of thumb: reach for a signal first; only move up to a shared store (NgRx SignalStore / NgRx Store) when state is genuinely shared across distant components, or to the RxJS / server-state screen when what you are caching lives on a server. The three siblings build ON TOP of this vocabulary — signal / computed / effect — so this screen is the foundation for everything else in the section." />
      <ui-code-block
        language="ts"
        [code]="snippets.when"
        caption="The hub's decision rule, in code: signal first, store only when shared, RxJS for server caches."
        [defaultOpen]="true"
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 1. signal + WritableSignal API -->
  <ui-section-wrapper title="signal — the reactive cell">
    <ui-content-group-wrapper title="Read by calling it, written via set / update">
      <ui-text-block text="signal(initialValue) returns a WritableSignal<T>. You READ the value by calling the signal as a function — in templates and in TypeScript. You WRITE it three ways: set(value) replaces it wholesale; update(fn) derives the next value from the previous; asReadonly() hands out a read-only view so other components cannot mutate what you own. Equality is === by default, so for arrays and objects you produce a NEW reference on each write (spread + map/filter) — never mutate in place, or the change will not register and the view will not update." />
      <ui-code-block
        language="ts"
        [code]="snippets.signal"
        caption="signal + the WritableSignal API: read by calling, write with set/update, freeze with asReadonly."
        [defaultOpen]="true"
      />
      <ui-example label="A counter — set / update / computed, all OnPush">
        <app-signals-computed-demo />
      </ui-example>
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 2. computed — derive, don't duplicate -->
  <ui-section-wrapper title="computed — derive, don't duplicate">
    <ui-content-group-wrapper title="The #1 rule of signals">
      <ui-text-block text="If a value can be computed from state you already hold, compute it — do not store it. A stored copy has to be kept in sync by hand, and the moment you forget, the UI lies. A computed is lazy (runs only when read), memoised (reuses the last value until a dependency changes), and tracks its dependencies automatically by virtue of reading them. The remaining count, a filtered list, an is-form-valid flag, a formatted price: all derived. The counter demo above already uses computed for double and parity; the todo demo below uses it for the visible list and every count." />
      <ui-code-block
        language="ts"
        [code]="snippets.computed"
        caption="computed — lazy, memoised, auto-tracking. Always correct, always free."
        [defaultOpen]="true"
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 3. The centerpiece — the todo app -->
  <ui-section-wrapper title="Live — a full todo app built from signals">
    <ui-content-group-wrapper title="The same todo app you will see on every screen in this section">
      <ui-text-block text="The centerpiece. A complete, working todo application built entirely from signals. The source of truth is ONE signal holding the array; the filter is a second signal. Adding, toggling, and clearing are update calls that produce a new array. EVERYTHING else — the visible list, the remaining count, the total, the done count — is computed from those two signals, so none of them can ever drift. Toggle the filter chips, add a few items, mark some done, and clear done: every number updates instantly, and the component is plain OnPush with no manual change detection." />
      <ui-example label="Add, toggle, filter all/active/done, clear done — counts via computed">
        <app-signals-todo-demo />
      </ui-example>
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 4. effect — reactive side-effects -->
  <ui-section-wrapper title="effect — reactive side-effects">
    <ui-content-group-wrapper title="For talking to the outside world">
      <ui-text-block text="An effect runs a side-effect whenever a signal it reads changes. Create it in the injection context (a constructor, a field initializer, or a function that runs in one) so Angular owns its lifetime and tears it down with the component; the first run is scheduled at the end of change detection. Effects are for wiring signals to the OUTSIDE world: logging, analytics, persisting to localStorage, imperatively driving a non-signal API. Do NOT use an effect to write other signals — that creates update cycles Angular refuses to schedule, and it is almost always a computed or linkedSignal in disguise." />
      <ui-code-block
        language="ts"
        [code]="snippets.effect"
        caption="effect — side-effects only. The injection context owns its lifetime."
        [defaultOpen]="true"
      />
      <ui-example label="Bump the count — each change appends to the on-screen log">
        <app-signals-effect-demo />
      </ui-example>
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 5. linkedSignal — a writable computed -->
  <ui-section-wrapper title="linkedSignal — a writable computed">
    <ui-content-group-wrapper title="A derived value the user can override">
      <ui-text-block text="A computed is read-only — it always reflects its sources. Sometimes you want a value that is DERIVED from a source by default BUT can be overridden by the user: a default selection that the user can change, a sort order that resets when the data changes, a draft that the user can edit. That is exactly linkedSignal: it recomputes from its source when the source changes (like computed), AND it has set / update (like signal). The demo below picks a user to set a default note (the computation), then typing overrides it (a manual write) — and picking a different user resets the note to that user's default, because the source change wins." />
      <ui-code-block
        language="ts"
        [code]="snippets.linkedSignal"
        caption="linkedSignal — derived by default, writable on demand, reset when the source changes."
        [defaultOpen]="true"
      />
      <ui-example label="Pick a user to reset the note; type to override until you pick again">
        <app-signals-linked-signal-demo />
      </ui-example>
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 6. toSignal / toObservable — the RxJS bridge -->
  <ui-section-wrapper title="toSignal / toObservable — the RxJS bridge">
    <ui-content-group-wrapper title="One primitive, two ecosystems">
      <ui-text-block text="toSignal converts an Observable into a signal; toObservable does the reverse. The bridge is the seam between Angular's signal world and the RxJS ecosystem — HttpClient results, the router's ActivatedRoute, event streams. The classic round trip is a signal kicked by user input, piped through RxJS operators (debounceTime, switchMap to an HTTP call), and folded back into a signal the template reads. toSignal requires an initial value (a signal always has a value to render) and the subscription is tied to the component's lifetime, so there is no manual subscribe / unsubscribe to forget." />
      <ui-code-block
        language="ts"
        [code]="snippets.bridge"
        caption="toSignal (HttpClient → signal) and toObservable (signal → RxJS operators)."
        [defaultOpen]="true"
      />
      <ui-example label="signal → toObservable → switchMap+timer → toSignal → template">
        <app-signals-to-signal-demo />
      </ui-example>
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 7. Signal inputs + queries -->
  <ui-section-wrapper title="Signal inputs & queries — input, model, viewChild">
    <ui-content-group-wrapper title="The component API is signals too">
      <ui-text-block text="The same signal vocabulary extends to a component's boundary. input() declares a one-way signal input — readable inside the child as a signal, reactive, and (unlike @Input()) it does NOT trigger ngOnChanges; react to it with computed / effect instead. model() declares a two-way signal input the parent binds with [(value)], so the child writes and the parent's signal stays in sync. output() is the event counterpart (the right side of banana-in-a-box). Signal queries (viewChild / contentChild, plus the plural forms) replace the old @ViewChild / @ContentChild decorators — they return a SIGNAL of the queried node, so they compose with computed / effect and update automatically if the node appears or disappears behind an @if." />
      <ui-code-block
        language="ts"
        [code]="snippets.inputs"
        caption="input() (one-way), model() (two-way), output() (events)."
        [defaultOpen]="true"
      />
      <ui-code-block
        language="ts"
        [code]="snippets.queries"
        caption="viewChild / contentChild — signal queries that track the queried node."
      />
      <ui-example label="model() two-way + input() + a viewChild signal query that flips with @if">
        <app-signals-inputs-demo />
      </ui-example>
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 8. Why OnPush + signals is the modern answer -->
  <ui-section-wrapper title="Why signals + OnPush is the modern local-state answer">
    <ui-content-group-wrapper title="Change detection you rarely think about">
      <ui-text-block text="OnPush tells Angular only to check a component if its inputs changed OR it asked to be checked. Pre-signals, asked meant markForCheck, the AsyncPipe, or a manual nudge — easy to get wrong, and the cause of most stale-view bugs. With signals, that contract becomes automatic: a signal WRITE schedules change detection on exactly the components that READ it. No zone, no markForCheck, no stale view. Every demo on this screen is OnPush and updates instantly with zero change-detection plumbing. The rule that follows: make every component OnPush, hold its local state in signals, read inputs as signal inputs (input() / model()). You rarely think about change detection again." />
      <ui-code-block
        language="ts"
        [code]="snippets.onpush"
        caption="OnPush + signals + signal inputs — the default move for every component."
        [defaultOpen]="true"
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>
</div>
