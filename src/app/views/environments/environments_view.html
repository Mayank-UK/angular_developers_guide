<div class="page">
  <!-- 0. What and why -->
  <ui-section-wrapper
    title="Environments / flavours — the Angular way in this app"
  >
    <ui-content-group-wrapper title="Same code, different facts">
      <ui-text-block text="An environment is the set of facts the app is built with: which API base URL to call, whether to wire the fake backend or the live one, whether to log, whether to inject failures for QA. The code is identical across environments — only those facts change. Keeping them apart lets you run the app locally against in-memory fakes (fast, offline, failure-injectable), exercise the real pipeline against a staging server (production-shaped but throwaway), and ship a stripped-down bundle to production. The rule: no environment-specific branches inside feature code — all of it reads from AppConfig, so 'which environment am I in?' has one answer, in one place." />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="Angular's mechanism: fileReplacements, not .env files"
    >
      <ui-text-block text="The React sibling of this app uses Vite's --mode to pick a .env.<mode> file. Angular does NOT. Angular swaps ONE TypeScript source file wholesale at build time: angular.json has a fileReplacements block per named configuration that replaces src/environments/environment.ts with environment.development.ts or environment.staging.ts. Each file exports the same 'environment' const with the SAME shape, just different values; core/config/createAppConfig turns it into a typed AppConfig; provideData(config) reads config.wiring to bind fake-vs-live sources. One --configuration flag selects the flavour; the entire DI graph re-wires with no view changes. There is no runtime env switch — the selected file's values are inlined into the bundle at build time." />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

    <ui-content-group-wrapper title="Read the differences as policy">

• staging points at the real backend with the real HttpClient + real IndexedDB cache, still non-production so ScenarioService failure injection can run for QA.
• production is the default file; it carries production=true (which gates optimization on, logs to error-only, and disables the NgRx devtools). Its wiring is currently fakes too so this teaching artifact's prod bundle runs offline — flip wiring.remote/wiring.db to 'live' before shipping against a real API." />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

      title="One configuration per flavour, each swapping one file"

  <!-- 3. createAppConfig — the typed seam -->
  <ui-section-wrapper
    title="createAppConfig — the typed seam (config in, AppConfig out)"
  >
    <ui-content-group-wrapper
      title="One function turns the raw record into a typed AppConfig"
    >
      <ui-text-block text="Every environment fact enters the app through ONE function: createAppConfig. It takes the raw object exported by the selected environment*.ts file, defensively copies the wiring/scenario (so they cannot be mutated after bootstrap), and returns a typed AppConfig. No other file reads the environment record directly — it reads inject(APP_CONFIG) instead. That keeps the 'where did this value come from?' answer to one place, and makes the config unit-testable (a spec passes a fake environment object). Pure TypeScript — no Angular import — so it runs in a Node test without TestBed." />
      <ui-code-block
        language="ts"
        [code]="snippets.createAppConfig"
        [defaultOpen]="true"
        caption="src/core/config/index.ts — createAppConfig."
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="The AppConfig shape — const-object + literal union, NOT enum"
    >
      <ui-text-block text="EnvironmentName is a const-object + its keyof literal union (the project stays compatible with Angular's erasable-only TypeScript setting, so enums are off-limits). WiringConfig narrows remote/db to 'fake' | 'live' at the type level — a typo like 'fak' is a compile error, not a runtime surprise. The isDev/isStaging/isProd predicates carry the same logic without a switch statement. This is the typed contract every layer consumes; the environment files are just one way to produce one." />
      <ui-code-block
        language="ts"
        [code]="snippets.appConfigType"
        [defaultOpen]="true"
        caption="src/core/config/app-config.ts — AppConfig + EnvironmentName."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 4. How wiring flips the DI graph -->
  <ui-section-wrapper
    title="How wiring flips the DI graph — fake vs live"
  >
    <ui-content-group-wrapper
      title="provideData reads ONE field and re-wires everything"
    >
      <ui-text-block text="provideData(config) is where the environment meets the dependency graph. It reads config.wiring.remote and config.wiring.db, picks FakeApiService vs PostApiService and FakeAppDatabase vs AppDatabaseImpl, and binds the POST_REPOSITORY and GET_POSTS_USE_CASE tokens through factories. So flipping one field in an environment file — wiring.remote: 'fake' → 'live' — and rebuilding re-wires the entire graph from in-memory fakes to a live REST + IndexedDB backend. Not a single view changes; the tokens abstract which concrete class fills each slot. HttpClient is intentionally NOT provided here: the fake path needs no HTTP, and the live path consumes provideHttpClient(withInterceptors([retryInterceptor])) registered alongside it in app.config.ts." />
      <ui-code-block
        language="ts"
        [code]="snippets.provideData"
        [defaultOpen]="true"
        caption="src/data/providers.ts — the fake-vs-live swap driven by config.wiring."
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="Bootstrap wires it once"
    >
      <ui-text-block text="app.config.ts calls createAppConfig(environment) — reading whichever file angular.json's fileReplacements selected — and hands the result to provideData, which registers the result against the root injector. By the time any component mounts, every token is resolvable. There is no manual container.initialize() (the React sibling's step); Angular's bootstrapApplication IS the initialization." />
      <ui-code-block
        language="ts"
        [code]="snippets.bootstrap"
        [defaultOpen]="true"
        caption="src/app/app.config.ts + src/main.ts — the root providers list."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 7. Angular vs Vite vs Flutter -->
  <ui-section-wrapper
    title="Angular fileReplacements vs Vite --mode vs Flutter --flavor"
  >
    <ui-content-group-wrapper
      title="Same goal (same code, per-environment facts), different mechanism"
    >
      <ui-text-block text="The goal — one codebase, per-environment facts — is identical across the three stacks this guide references. The mechanism differs sharply. Angular swaps a TypeScript file wholesale at build time (a string-level replace before compilation); Vite loads a .env.<mode> file and exposes only VITE_-prefixed vars to import.meta.env; Flutter typically uses separate entrypoints (main_dev.dart, main_staging.dart, main_prod.dart) plus native flavours (Android applicationId suffixes, iOS schemes), which is more moving parts per environment because there is a native layer. Crucially, none of these protects a client-bundled secret — anything inlined into the JS the browser downloads is public. Real secrets belong behind a backend." />
      <ui-code-block
        language="text"
        [code]="snippets.contrast"
        [defaultOpen]="false"
        caption="Three stacks, one goal."
      />
    </ui-content-group-wrapper>
