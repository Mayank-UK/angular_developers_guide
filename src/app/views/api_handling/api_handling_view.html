<div class="page">
  <!-- 0. The whole pipeline at a glance -->
  <ui-section-wrapper title="API handling — the Angular way in this app">
    <ui-content-group-wrapper
      title="Why so many layers for one list of posts"
    >
      <ui-text-block text="A component in this app never talks to the network directly. Between 'the UI wants posts' and 'the REST server returns JSON' there is a chain of single-purpose types, and the chain is the point: each link can be replaced, tested in isolation, or rerouted (real API ↔ fake, remote ↔ cache) without touching its neighbours. The UI depends on a CONTRACT (a domain interface exposed through a DI token), not on HttpClient, not on JSON, not on a URL. That independence is what makes the feature maintainable — and it is exactly the pipeline this app ships in src/domain + src/data + src/core." />
      <ui-code-block
        language="text"
        [code]="snippets.pipeline"
        [defaultOpen]="true"
        caption="view → use case → repository → remote/HttpClient → DTO↔domain → Result. The whole chain already exists in this app."
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="What each layer is responsible for"
    >
      <ui-text-block text="Use case — one app action ('get posts'). Thin today; the seam where cross-cutting policy lives (combine sources, enforce a rule, log). Keeps repositories focused on a single data source. Resolved by the view through the GET_POSTS_USE_CASE DI token.

Repository (interface) — the contract. The UI and use cases depend on this and nothing concrete. Swapping the implementation is invisible to them.

Repository implementation — orchestrates sources: try remote, write-through to the local cache, and fall back to that cache when the network fails (offline-first). This is where 'where does the data come from?' is answered.

Remote data source + HttpClient — the only place that knows about the network. The data source returns DTOs and upgrades raw engine errors into typed exceptions; HttpClient owns the transport and the interceptor chain (retry on transient failures).

DTO — the wire/on-disk shape. It (de)serializes JSON and maps to the domain model. DTOs never leak past the repository — the view imports the domain Post, never a PostDTO." />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 1. Domain layer — the contract -->
  <ui-section-wrapper
    title="Domain layer — the contract the UI depends on"
  >
    <ui-content-group-wrapper
      title="A repository is just an interface (framework-free)"
    >
      <ui-text-block text="The domain layer has no imports from HttpClient, IndexedDB, or any data-source concrete class. It declares what 'reading posts' means as a plain interface returning a Result. The use case depends on this interface; the UI depends on the use case. Neither knows or cares that the implementation hits a REST API behind a cache. That is the dependency rule: dependencies point inward, toward the domain, which depends on nothing but core/result." />
      <ui-code-block
        language="ts"
        [code]="snippets.domain"
        [defaultOpen]="true"
        caption="src/domain/models/post.ts, src/domain/repositories/post-repository.ts, src/domain/usecases/get-posts-usecase.ts"
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper title="Why a use case when it just delegates">
      <ui-text-block text="It is a one-liner today, but the boundary matters. The use case is where you later add 'get posts, but only the published ones, and log the call' without bloating the repository or leaking that rule into the UI. The repository stays single-source; the use case owns the app's policy for that action. It is also the natural DI boundary: the view injects GET_POSTS_USE_CASE, not the repository, so policy has exactly one home." />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 2. The DI seam -->
  <ui-section-wrapper
    title="The DI seam — InjectionTokens, not a service locator"
  >
    <ui-content-group-wrapper
      title="Angular native DI exposes the domain contracts"
    >
      <ui-text-block text="The React sibling hand-rolls a container (container.ts) with a getPostsUseCase accessor. Angular has first-class DI, so the contracts the domain defines are exposed to injection via InjectionTokens in src/core/di/tokens.ts. Crucially, core/ may import @angular/core but domain/ must stay framework-free — so the tokens reference the domain contracts via TYPE-ONLY imports (no runtime coupling). A view then resolves data with inject(GET_POSTS_USE_CASE) and never touches HttpClient, a DTO, or a repository implementation. That is the whole point of the screen." />
      <ui-code-block
        language="ts"
        [code]="snippets.tokens"
        [defaultOpen]="true"
        caption="src/core/di/tokens.ts — APP_CONFIG, POST_REPOSITORY, GET_POSTS_USE_CASE."
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="Fake-vs-live wiring is one provider function"
    >
      <ui-text-block text="provideData(config) in src/data/providers.ts is the Angular equivalent of container.initialize(). It reads AppConfig.wiring (fake | live, swapped per environment via angular.json fileReplacements), picks the remote + local implementations, and binds the PostRepository and GetPostsUseCase contracts to their tokens through factories. HttpClient is intentionally NOT provided here — the fake path needs no HTTP, and the live path consumes provideHttpClient(withInterceptors([retryInterceptor])) registered once in app.config.ts. So flipping dev → prod changes the wiring object in one environment file and the entire graph re-wires; no view changes." />
      <ui-code-block
        language="ts"
        [code]="snippets.providers"
        [defaultOpen]="true"
        caption="src/data/providers.ts — provideData(config) wires fake-vs-live + binds the tokens."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 3. DTOs -->
  <ui-section-wrapper
    title="DTOs — the shape on the wire, not in the app"
  >
    <ui-content-group-wrapper title="DTO ≠ domain model, on purpose">
      <ui-text-block text="The JSON the API returns is not the object the rest of the app works with. A DTO (Data Transfer Object) is the raw transport shape — it can change when the API changes, carry fields the app doesn't care about, and need validation (ids that arrive as strings, missing fields). The DTO owns that mess: it validates the payload (throwing on malformed data so NaN ids never reach the UI), and maps to the clean domain model one layer up. If the API renames a field, you fix one mapper, not every screen. In TypeScript types are erased at runtime, so a DTO is a plain interface plus pure conversion functions — no runtime class, unlike Dart's fromJson factory. DTOs never leave the data layer." />
      <ui-code-block
        language="ts"
        [code]="snippets.dto"
        [defaultOpen]="true"
        caption="src/data/remote/post-dto.ts — PostDTO + postDtoFromJson (validates) + dtoToPost (maps to domain)."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 4. Remote data source + HttpClient -->
  <ui-section-wrapper
    title="Remote data source + HttpClient — the only place that knows the network"
  >
    <ui-content-group-wrapper
      title="The data source returns DTOs and upgrades errors"
    >
      <ui-text-block text="PostApiService is the live Angular implementation of the PostRemoteDataSource contract. It calls HttpClient, checks the response shape, and deserializes into DTOs. Crucially it wraps the work in guardedApiCall so that any raw engine error (HttpErrorResponse, JSON parse, TypeError) is upgraded into a typed AppException before it leaves the data layer. The repository above never sees an HttpErrorResponse — only typed exceptions it can branch on. Non-2xx responses become a ServerException. Note how APP_CONFIG supplies apiBaseUrl — the service is environment-driven, not hard-coded." />
      <ui-code-block
        language="ts"
        [code]="snippets.remote"
        [defaultOpen]="true"
        caption="src/data/remote/post-api.service.ts — inject(HttpClient) + inject(APP_CONFIG) + guardedApiCall."
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="The retry interceptor — functional, idempotent, jittered"
    >
      <ui-text-block text="retry.interceptor.ts is a functional HttpInterceptorFn registered once in app.config.ts via withInterceptors([retryInterceptor]). It retries only idempotent methods (GET/HEAD/OPTIONS/PUT/DELETE) on transient failures (NetworkException / TimeoutException) with exponential full-jitter backoff (random(0, base * 2^(attempt-1)) to avoid thundering-herd retries against a recovering server. Errors that are already typed AppExceptions are never retried — they are intentional, not transient. On exhaustion the error is mapped to a typed AppException via the single shared httpErrorToException mapping, so the data layer only ever handles one error shape. This is the canonical interceptor example — referenced (not modified) by this screen." />
      <ui-code-block
        language="ts"
        [code]="snippets.interceptor"
        caption="src/data/remote/retry.interceptor.ts — HttpInterceptorFn + catchError + timer + concatMap."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 5. Repository impl — offline-first -->
  <ui-section-wrapper
    title="Repository implementation — orchestration + offline-first"
  >
    <ui-content-group-wrapper
      title="Try remote, write-through to cache, fall back on failure"
    >
      <ui-text-block text="PostRepositoryImpl is where 'where does the data come from?' is answered. On success it writes the remote DTOs through to the local cache (best-effort — a cache write failure is only logged). On network or server failure it falls back to the cache: a cache hit yields Success(posts, warning = networkFailure) — a non-blocking Result.Success that carries a warning, the offline-first pattern in one value; a cache miss yields Failed(networkFailure) — blocking; a cache read that itself throws yields a chained CacheFailure whose .cause reconstructs the whole story for logs. The DTO → domain mapping (dtoToPost) happens HERE, once, so only domain Post objects travel up to the use case and UI." />
      <ui-code-block
        language="ts"
        [code]="snippets.repository"
        [defaultOpen]="true"
        caption="src/data/repositories/post-repository-impl.ts — safeRepositoryCall + serveFromCache fallback."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 6. The error pipeline -->
  <ui-section-wrapper
    title="Error pipeline — engine error → AppException → Failure → Result"
  >
    <ui-content-group-wrapper
      title="Two stages: technical exception, then semantic failure"
    >
      <ui-text-block text="This is the spine of the app. An engine error (HttpClient / IndexedDB / JSON) is caught at the data source and upgraded to a typed AppException via guardedApiCall / httpErrorToException (status 0 → NetworkException, 408 → TimeoutException, 401/403 → AuthException, 5xx → ServerException). The repository then maps that AppException to a user-facing Failure via mapExceptionToFailure, recursively preserving the cause chain. Finally the Failure is wrapped in a Result (Success with an optional non-blocking warning, or Failed with the blocking Failure) and travels up to the UI. The two stages are decoupled on purpose: AppException is technical (what broke), Failure is semantic (what to show the user, how loudly via severity). The UI reasons only about Failure.kind / severity — it never imports HTTP concepts." />
      <ui-code-block
        language="ts"
        [code]="snippets.guards"
        [defaultOpen]="true"
        caption="src/core/error-handling/guards.ts — httpErrorToException + mapExceptionToFailure."
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="The Result type — failures are values, not exceptions"
    >
      <ui-text-block text="Expected failures (no network, server 500, empty cache) are not bugs — they are outcomes the UI must handle. So the repository does not throw them at the UI; it returns a Result, a discriminated union on result.ok. Success carries the value and an optional non-blocking warning (stale cache served despite a network failure — the offline-first pattern in a single value). Failed carries the blocking Failure. The component switches on result.ok with full type narrowing. Only truly unexpected errors throw; everything anticipated is a value travelling up the pipeline. Severity then drives presentation: critical → full-screen <ui-show-error/>; warning/info → non-blocking notice." />
      <ui-code-block
        language="ts"
        [code]="snippets.result"
        [defaultOpen]="true"
        caption="src/core/result.ts — Result<T> = Success<T, warning?> | Failed."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 7. Fake wiring — why the demo works offline -->
  <ui-section-wrapper
    title="Fake wiring — why the live demo runs offline"

    <ui-content-group-wrapper
      title="Dev wiring points the tokens at in-memory fakes"
    >
      <ui-text-block text="The dev environment (environment.development.ts) sets wiring to { remote: 'fake', db: 'fake' }, so provideData registers FakeApiService and FakeAppDatabase instead of the live PostApiService / AppDatabaseImpl. FakeApiService returns canned PostDTO[] after a 600ms delay and throws typed AppExceptions based on ScenarioService toggles — so the failure path is exercisable with no backend. The tokens, the use case, the repository impl, and the error pipeline are all the REAL production code; only the leaf data sources are swapped. That is why the live demo below drives the genuine Result<Post[]> pipeline (loading / success / error / offline-first warning) entirely offline." />
      <ui-code-block
        language="ts"

  <ui-section-wrapper

  <!-- 9. How the view consumes it -->
  <ui-section-wrapper
    title="How the view consumes it — a signal state machine off Result"
  >
    <ui-content-group-wrapper
      title="The view holds no transport, only a Result-driven state machine"
    >
      <ui-text-block text="The pipeline produces a Result; the UI still needs loading / success / error states to render. The idiomatic Angular home for that here is a small discriminated-union signal (DemoStatus) driven straight off Result — call execute(), set the state based on result.ok, and the OnPush template reacts because signal writes ARE the change-detection trigger (no zone, no markForCheck). The component itself stays declarative: the template @switches on status and renders a spinner, the post list (plus an optional non-blocking warning banner when Result.Success carries one), or <ui-show-error/> for the blocking failure. The same shape scales up to toSignal-bridged RxJS for the heavier cases (see the RxJS / server-state screen)." />
      <ui-code-block
        language="ts"
        [code]="snippets.consume"
        [defaultOpen]="true"
        caption="This screen's own PostsDemo — inject(GET_POSTS_USE_CASE) + a status signal + @switch."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>
