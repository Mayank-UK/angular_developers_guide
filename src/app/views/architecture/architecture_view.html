<div class="page">
  <!-- 0. What architecture is, and why -->
  <ui-section-wrapper
    title="Architecture — how this app's code is organised to stay maintainable"
  >
    <ui-content-group-wrapper
      title="Separating things that change for different reasons"
    >
      <ui-text-block text="Architecture is not about folders for their own sake — it is a rule about which code is allowed to know about which other code. As a feature grows, different parts change at different speeds and for different reasons: the endpoint URL changes when the backend moves, the loading spinner changes when the designer restyles, the caching rule changes when the product adds offline mode. If all of that lives in one place, every change touches everything and every change risks breaking everything. Separating those concerns into layers means a change in one layer has no reason to touch the others — and a bug introduced in one layer cannot silently travel into another, because the dependency direction forbids the import." />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper title="The cost of not doing it">
      <ui-text-block text="The alternative — fetch-and-setState inline in the component — works for a demo and then rots. The component ends up knowing the endpoint shape, the DTO-to-model mapping, the cache strategy, the error wording, and the spinner state all at once. You cannot test the fetch without rendering the component, cannot swap the real API for a fake without editing the component, and cannot reuse the logic in a second screen without copying it. Every one of those pains is a layer boundary that was never drawn. This app's four layers — domain, data, core, ui — are those boundaries, and Angular's native DI is the single seam that lets the outer ui layer reach data without a hard dependency on it." />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 2. The dependency rule -->
  <ui-section-wrapper title="The dependency rule — every arrow points inward">
    <ui-content-group-wrapper
      title="Domain is framework-free; data implements domain; ui talks to use cases"
    >
      <ui-text-block text="The single rule that makes the layers work: dependencies point inward, toward the domain. The domain layer has no imports of Angular, HttpClient, Dexie, or anything browser-specific — it is plain TypeScript types and pure classes, so it could run in Node, in a worker, or in tests with zero setup. The data layer implements the domain's contracts (PostRepositoryImpl satisfies the PostRepository interface the domain defines) and is the only place framework imports live. The ui layer depends on domain use cases and models, never on a concrete data implementation — it asks the DI system for GET_POSTS_USE_CASE and has no idea whether that resolves to a real REST client or a fake." />
      <ui-code-block
        language="ts"
        [code]="snippets.tokensExcerpt"
        [defaultOpen]="true"
        caption="src/core/di/tokens.ts — the DI seam (type-only domain imports)."
      />
    </ui-content-group-wrapper>
    <ui-content-group-wrapper
      title="The one escape hatch: the composition root"
    >
      <ui-text-block text="There is exactly one place allowed to know about concrete implementations: src/data/providers.ts. It is the composition root — the file that wires PostRepositoryImpl to the real or fake sources and binds the finished GetPostsUseCase to its token so the rest of the app can inject it. This is not a violation of the rule; it is the rule's escape hatch. Every other file depends on an interface, and this one file is where interfaces meet instances. The Dependency-management screen covers it in depth; here we only note that provideData(config) is the single arrow allowed to point outward." />
      <ui-code-block
        language="ts"
        [code]="snippets.providersExcerpt"
        [defaultOpen]="true"
        caption="src/data/providers.ts — provideData(config): the composition root."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 4. Smart vs presentational components -->
  <ui-section-wrapper
    title="Smart vs presentational components — the Angular split"
  >
    <ui-content-group-wrapper
      title="Containers resolve data; dumb components render inputs"
    >
      <ui-text-block text="Within the ui layer, components split into two roles. Smart (container) components resolve data through inject() — use cases, stores, tokens — own interaction state as signals, and pass data down. Presentational (dumb) components take signal inputs, emit events via output()/model(), and contain zero data-fetching logic. This app's shared primitives in ui/components/ (section-wrapper, code-block, example, show-error, theme-toggle) are all presentational — they are reused across every screen precisely because they depend on nothing but their inputs. The rule for where a component lives: used by more than one file → ui/components/; used by one screen → that screen's feature folder." />
      <ui-code-block
        language="text"
        [code]="snippets.smartVsPresentational"
        [defaultOpen]="true"
        caption="Smart/container vs presentational/dumb — and the folder rule."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 6. The error pipeline crosses layers -->
  <ui-section-wrapper
    title="The error pipeline crosses every layer — as values"
  >
    <ui-content-group-wrapper
      title="AppException (data) → Failure (domain) → Result<T> (UI)"
    >
      <ui-text-block text="Errors are the spine of this app, and the pipeline is itself a layered concern: an engine error is caught in the data layer, typed as an AppException, mapped at the boundary into a domain Failure (kind + severity + user message), and returned to the UI as a Result.Failed value. The UI never imports AppException or HttpErrorResponse; it switches on Failure.severity — critical → full-screen <ui-show-error/>, warning/info → non-blocking banner. The Exception-handling screen is the deep dive; this is the map." />
      <ui-code-block

        [defaultOpen]="true"
        caption="Engine error → AppException → Failure → Result<T>."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>

  <!-- 7. Why it pays off -->
  <ui-section-wrapper title="Why these boundaries pay off">
    <ui-content-group-wrapper
      title="Four concrete wins, each a direct consequence of the rule"
    >
      <ui-text-block text="Testability, swappability, parallel work, and framework isolation. Each is a property you GET from the dependency rule, not something you bolt on later. The repository is exercised against in-memory fakes with no network and no DOM; the same screen runs against the live backend in staging and a canned fake in dev selected by one config field; a team can split along the seams and merge without conflicts; and Angular, HttpClient, and Dexie each appear in exactly one layer, so swapping one touches a single file." />

        [defaultOpen]="true"
        caption="The four payoffs of the dependency rule."
      />
    </ui-content-group-wrapper>
  </ui-section-wrapper>
