# Full nginx.conf tuned to run as the non-root `nginx` user.
# The stock pid (/run/nginx.pid) and temp paths (/var/cache/nginx/*) are not
# writable by a non-root user, so we relocate them to /tmp, which is
# world-writable in the alpine image. Site config lives in conf.d/default.conf.

user                    nginx;
worker_processes        auto;
pid                     /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Relocated temp paths so the non-root worker can write them.
    client_body_temp_path   /tmp/client_temp;
    proxy_temp_path         /tmp/proxy_temp;
    fastcgi_temp_path       /tmp/fastcgi_temp;
    uwsgi_temp_path         /tmp/uwsgi_temp;
    scgi_temp_path          /tmp/scgi_temp;

    sendfile            on;
    keepalive_timeout   65;

    include             /etc/nginx/conf.d/*.conf;
}
